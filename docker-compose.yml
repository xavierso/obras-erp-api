version: '3.8'

services:
  db:
    image: postgres:15
    container_name: obras_db
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: obras_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: obras_api
    ports:
      - "8000:8000"
    environment:
      # Sobrescribimos la URL de la base de datos para apuntar al contenedor 'db'
      - DATABASE_URL=postgresql+asyncpg://usuario:password@db:5432/obras_db
      - SECRET_KEY=genera-una-clave-larga-y-aleatoria-aqui
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - APP_NAME=Obras ERP API
      - DEBUG=True
      - STORAGE_DIR=/app/storage
      - ALLOWED_ORIGINS=*
    volumes:
      # Mapeamos la carpeta storage local al contenedor para persistir las subidas
      - ./storage:/app/storage
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
